name: Package Source Code

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create ZIP package
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME=$(date +%Y%m%d-%H%M%S)
          fi
          
          echo "打包文件名: ${REPO_NAME}-${TAG_NAME}.zip"
          
          # 创建临时目录
          mkdir -p /tmp/package
          
          # 复制所有文件到临时目录（排除 .git 和 .github）
          rsync -av --exclude='.git' --exclude='.github' ./ /tmp/package/
          
          # 进入临时目录的上一级
          cd /tmp
          
          # 打包 package 文件夹里的内容，而不是 package 文件夹本身
          cd package
          zip -r "/tmp/${REPO_NAME}-${TAG_NAME}.zip" ./*
          cd ..
          
          # 把 zip 文件移回工作目录
          mv "/tmp/${REPO_NAME}-${TAG_NAME}.zip" /home/runner/work/Zenith-Core/Zenith-Core/
          
          # 确认文件存在
          ls -la /home/runner/work/Zenith-Core/Zenith-Core/*.zip || echo "文件不存在"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: "*.zip"
          if-no-files-found: error
          retention-days: 90