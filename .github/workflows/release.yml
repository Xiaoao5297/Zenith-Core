name: Package Source Code

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create ZIP package
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME=$(date +%Y%m%d-%H%M%S)
          fi
          
          # 先用 rsync 复制文件到临时目录（排除 .github）
          mkdir -p /tmp/package
          rsync -av --exclude='.github' ./ /tmp/package/
          
          # 进入临时目录打包
          cd /tmp
          zip -r "${REPO_NAME}-${TAG_NAME}.zip" package/
          
          # 把 zip 文件移回工作目录
          mv "${REPO_NAME}-${TAG_NAME}.zip" /home/runner/work/Zenith-Core/Zenith-Core/
          
          ls -la *.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: "*.zip"
          retention-days: 90